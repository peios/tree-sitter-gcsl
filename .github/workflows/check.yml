name: Tree-sitter GCSL checks
on:
    pull_request:
    push:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: tree-sitter-gcsl-${{ github.ref }}
    cancel-in-progress: true
jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - name: Install Linux development tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential python3 python3-venv binutils
                  rustup toolchain install 1.98.1 --profile minimal --component rustfmt
            - name: Prepare pinned style tools
              run: python3 tools/prepare-style-tools.py "$RUNNER_TEMP/grammar-style"
            - name: Check code, parsers, queries, and packages
              env:
                  PEIOS_STYLE_BIN: ${{ runner.temp }}/grammar-style/bin
              run: tools/check
            - name: Check out the documentation compiler
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/trail
                  ref: 1d662e98cbcbdd5c51c01533afcab7f5723a2eff
                  path: .ci-tools/trail
                  persist-credentials: false
            - name: Build the pinned documentation compiler
              working-directory: .ci-tools/trail
              run: tools/bazel build //:trail
            - name: Check documentation
              env:
                  TRAIL: ${{ github.workspace }}/.ci-tools/trail/bazel-bin/trail
              run: tools/check-docs
